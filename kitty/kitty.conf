# ----------------------------------------------------
# VISUALS & WINDOW
# ----------------------------------------------------
# Increased opacity (93% solid) for a clean modern depth
background_opacity       0.6
dynamic_background_opacity yes

# Clean padding around text (looks like a modern app)
window_padding_width     12
hide_window_decorations  yes
remember_window_size     no
initial_window_width     960
initial_window_height    600

# ----------------------------------------------------
# FONTS & CURSOR
# ----------------------------------------------------
# Uses JetBrains Mono if installed, falls back to monospace
font_family              JetBrains Mono Regular
bold_font                JetBrains Mono Bold
font_size                11.0
disable_ligatures        never

# Sleek minimalist cursor
cursor_shape             beam
cursor_blink_interval    0.5

# ----------------------------------------------------
# COLOR PALETTE (Minimal Dark / Pastel Accents)
# ----------------------------------------------------
background               #1e1e24
foreground               #e2e2e9
selection_background     #3a3a44
selection_foreground     #e2e2e9
cursor                   #88c0d0

# Black / Grey
color0                   #1e1e24
color8                   #4c566a

# Red (Soft)
color1                   #bf616a
color9                   #bf616a

# Green (Mint)
color2                   #a3be8c
color10                  #a3be8c

# Yellow/Orange
color3                   #ebcb8b
color11                  #ebcb8b

# Blue (Frost)
color4                   #81a1c1
color12                  #81a1c1

# Magenta
color5                   #b48ead
color13                  #b48ead

# Cyan
color6                   #88c0d0
color14                  #8fbcbb

# White
color7                   #e5e9f0
color15                  #eceff4

# ----------------------------------------------------
# TABS & INTERACTION
# ----------------------------------------------------
# Clean, minimal tab bar at the bottom
tab_bar_edge             bottom
tab_bar_style            powerline
tab_powerline_style      slanted
active_tab_foreground    #1e1e24
active_tab_background    #88c0d0
inactive_tab_foreground  #e2e2e9
inactive_tab_background  #2e3440

# No annoying terminal bell
enable_audio_bell        no

# ----------------------------------------------------
# KEYBINDINGS
# ----------------------------------------------------
# Reload config on the fly
map ctrl+shift+f5        load_config_file

# Dynamic opacity adjustments
map ctrl+equal           change_background_opacity +0.05
map ctrl+minus           change_background_opacity -0.05

